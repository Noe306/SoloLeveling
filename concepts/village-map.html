<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dragon Village Map (concept)</title>
<style>
  /* Concept only: a standalone preview of the Phase 3 village map.
     Same "System" palette as the app (css/styles.css). */
  :root { --bg: #02050d; --line: #1d5aa8; --line-hi: #4aa3ff; --text: #d6e8ff; --muted: #7f9bc4; --cyan: #6be6ff; --gold: #f5b942; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: "Bahnschrift", "Segoe UI", system-ui, sans-serif; }
  header { padding: 1rem 1.25rem; border-bottom: 1px solid var(--line-hi); display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 1rem; letter-spacing: .18em; text-transform: uppercase; color: var(--cyan); text-shadow: 0 0 10px rgba(74,163,255,.5); }
  .ctrl { font-size: .8rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: .6rem; }
  input[type=range] { accent-color: var(--line-hi); width: 180px; }
  #lvl { color: var(--cyan); font-weight: 700; min-width: 2.5rem; }
  .wrap { max-width: 1400px; margin: 0 auto; padding: .5rem; }
  svg { width: 100%; height: auto; display: block; }
  .tip { position: fixed; pointer-events: none; background: rgba(6,16,38,.95); border: 1px solid var(--line-hi); padding: .45rem .7rem; font-size: .8rem; box-shadow: 0 0 16px rgba(74,163,255,.4); display: none; max-width: 260px; }
  .tip b { color: var(--cyan); letter-spacing: .08em; text-transform: uppercase; }
  footer { color: var(--muted); font-size: .78rem; padding: 0 1.25rem 1.5rem; max-width: 1400px; margin: 0 auto; }
  .plot { cursor: pointer; }
  .plot:hover .hex { filter: brightness(1.35) drop-shadow(0 0 8px currentColor); }
  @media (prefers-reduced-motion: no-preference) { .lava { animation: glow 3s ease-in-out infinite; } }
  @keyframes glow { 50% { opacity: .65; } }
</style>
</head>
<body>
<header>
  <h1>◆ Dragon Village: Map Concept</h1>
  <label class="ctrl">Player level <input id="level" type="range" min="1" max="20" value="6"> <span id="lvl"></span></label>
</header>
<div class="wrap"><svg id="map" viewBox="0 0 1400 1040" role="img" aria-label="Concept map of a dragon-shaped village island"></svg></div>
<footer>Concept preview, not wired into the app. Move the slider to see which element habitats unlock at each player level (1 per level up to 16). Hover a plot for details.</footer>
<div id="tip" class="tip"></div>

<script>
/* ---------- Data ---------- */
var ELEMENTS = [
  ['Fire', '#ff5a36'], ['Water', '#2f8fff'], ['Earth', '#b07a3c'], ['Forest', '#3fbf5a'],
  ['Ice', '#8fe3ff'], ['Electric', '#ffe14d'], ['Wind', '#b8f0d0'], ['Metal', '#a9b4c2'],
  ['Light', '#fff3b0'], ['Dark', '#7b5bd8'], ['Poison', '#9be22d'], ['Crystal', '#ff7ad9'],
  ['Storm', '#8a7dff'], ['Spirit', '#5ee6c8'], ['Time', '#e0b25a'], ['Cosmic', '#c04dff']
];
// Habitat plot centres: left wing = levels 1-8, right wing = levels 9-16.
var HABITATS = [
  [460, 130], [540, 130], [620, 130], [700, 130], [500, 228], [580, 228], [660, 228], [740, 228],
  [840, 790], [920, 790], [1000, 790], [1080, 790], [860, 880], [940, 880], [1020, 880], [1100, 880]
];
// Core buildings: [x, y, radius, name, description, icon]
var BUILDINGS = [
  [720, 520, 62, 'Town Hall', 'Heart of the village. Its level follows your player level and gates every other building.', 'TH'],
  [560, 370, 42, 'Research Lab', 'Researches dragon evolution (Egg → Hatchling → Juvenile → Adult).', 'LAB'],
  [880, 670, 42, 'Training Camp', 'Levels dragons up, one at a time, like the Clash of Clans Laboratory.', 'TRN'],
  [1120, 690, 36, 'Hatchery', 'Breeding nest: produces a new egg when you want one.', 'EGG']
];
var HERO_ALTARS = [[160, 330], [205, 300], [215, 355]];

/* ---------- SVG helpers ---------- */
var NS = 'http://www.w3.org/2000/svg';
var svg = document.getElementById('map');
function el(tag, attrs, parent) {
  var n = document.createElementNS(NS, tag);
  for (var k in attrs) n.setAttribute(k, attrs[k]);
  (parent || svg).appendChild(n);
  return n;
}
function hexPoints(cx, cy, r) {
  var p = [];
  for (var i = 0; i < 6; i++) { var a = Math.PI / 3 * i + Math.PI / 6; p.push((cx + r * Math.cos(a)).toFixed(1) + ',' + (cy + r * Math.sin(a)).toFixed(1)); }
  return p.join(' ');
}
var tip = document.getElementById('tip');
function addTip(node, html) {
  node.addEventListener('mousemove', function (e) { tip.innerHTML = html; tip.style.display = 'block'; tip.style.left = (e.clientX + 14) + 'px'; tip.style.top = (e.clientY + 14) + 'px'; });
  node.addEventListener('mouseleave', function () { tip.style.display = 'none'; });
}

/* ---------- Static terrain (drawn once) ---------- */
function drawTerrain() {
  var defs = el('defs', {});
  defs.innerHTML =
    '<radialGradient id="abyss" cx="50%" cy="45%" r="70%"><stop offset="0" stop-color="#0b1d44"/><stop offset="1" stop-color="#02050d"/></radialGradient>' +
    '<linearGradient id="land" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a3b2a"/><stop offset=".55" stop-color="#1f2d24"/><stop offset="1" stop-color="#2b2420"/></linearGradient>' +
    '<linearGradient id="wing" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b2a40"/><stop offset="1" stop-color="#1b1a2c"/></linearGradient>' +
    '<filter id="rim" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#4aa3ff" flood-opacity=".55"/></filter>' +
    '<pattern id="scales" width="28" height="20" patternUnits="userSpaceOnUse"><path d="M0 20 Q14 2 28 20" fill="none" stroke="#000" stroke-opacity=".22" stroke-width="2"/></pattern>';
  el('rect', { x: 0, y: 0, width: 1400, height: 1040, fill: 'url(#abyss)' });
  // Faint stars / embers in the abyss
  for (var i = 0; i < 90; i++) el('circle', { cx: (i * 157) % 1400, cy: (i * 263) % 1040, r: (i % 3) * .6 + .4, fill: '#9cc8ff', opacity: .25 });

  var island = el('g', { filter: 'url(#rim)' });
  // Wings (membrane plateaus)
  el('polygon', { points: '470,300 370,30 490,80 590,10 680,80 790,20 830,300', fill: 'url(#wing)', stroke: '#3c3a66', 'stroke-width': 4 }, island);
  el('polygon', { points: '820,600 720,960 850,900 940,1000 1030,880 1160,950 1060,600', fill: 'url(#wing)', stroke: '#3c3a66', 'stroke-width': 4 }, island);
  // Wing bones
  [['500,290 380,40'], ['560,280 590,20'], ['680,280 785,30'], ['860,640 730,950'], ['940,650 940,990'], ['1020,640 1155,940']].forEach(function (b) {
    var p = b[0].split(' ');
    el('line', { x1: p[0].split(',')[0], y1: p[0].split(',')[1], x2: p[1].split(',')[0], y2: p[1].split(',')[1], stroke: '#4a4780', 'stroke-width': 6, 'stroke-linecap': 'round' }, island);
  });
  // Body (thick stroked curve) + tail
  var bodyD = 'M300 360 C 470 260, 650 320, 720 480 S 900 700, 1080 660';
  el('path', { d: bodyD, fill: 'none', stroke: 'url(#land)', 'stroke-width': 190, 'stroke-linecap': 'round' }, island);
  el('path', { d: 'M1060 665 C 1210 640, 1300 740, 1265 870', fill: 'none', stroke: '#26302a', 'stroke-width': 80, 'stroke-linecap': 'round' }, island);
  el('path', { d: 'M1265 860 L1215 930 L1265 1010 L1320 930 Z', fill: '#26302a' }, island);
  // Head
  el('path', { d: 'M300 290 L240 220 L150 205 L70 245 L140 300 L105 345 L215 395 L310 430 Z', fill: '#28372b' }, island);
  // Horns
  el('path', { d: 'M245 225 L285 120 L265 230 Z M205 212 L200 105 L228 214 Z', fill: '#c9b89a' }, island);
  // Back spikes along the body
  [[380, 255], [440, 300], [700, 330], [770, 420], [840, 520], [930, 570], [1020, 560]].forEach(function (s) {
    el('path', { d: 'M' + (s[0] - 14) + ' ' + (s[1] + 14) + ' L' + s[0] + ' ' + (s[1] - 22) + ' L' + (s[0] + 14) + ' ' + (s[1] + 14) + ' Z', fill: '#c9b89a', opacity: .85 }, island);
  });
  // Scale texture over the body
  el('path', { d: bodyD, fill: 'none', stroke: 'url(#scales)', 'stroke-width': 186, 'stroke-linecap': 'round' });
  // Lava eye + nostril pools, lava river along the spine
  el('ellipse', { cx: 190, cy: 255, rx: 22, ry: 12, fill: '#ff7a1a', class: 'lava' });
  el('ellipse', { cx: 100, cy: 255, rx: 8, ry: 5, fill: '#ff7a1a', class: 'lava' });
  el('path', { d: 'M330 360 C 480 290, 630 340, 690 470', fill: 'none', stroke: '#ff7a1a', 'stroke-width': 5, opacity: .5, class: 'lava', 'stroke-dasharray': '2 10', 'stroke-linecap': 'round' });
  // Claws (decor)
  [[600, 455], [660, 470]].forEach(function (c) { el('path', { d: 'M' + c[0] + ' ' + c[1] + ' l-10 26 l10 -8 l10 8 z', fill: '#c9b89a' }); });
}

/* ---------- Plots (redrawn when the level changes) ---------- */
var plotLayer = el('g', {});
function label(x, y, text, size, color, parent) {
  var t = el('text', { x: x, y: y, 'text-anchor': 'middle', 'font-size': size, fill: color, 'font-weight': 700, 'letter-spacing': '1.5', style: 'paint-order:stroke;stroke:#02050d;stroke-width:4px' }, parent);
  t.textContent = text;
  return t;
}

function drawPlots(level) {
  plotLayer.innerHTML = '';
  document.getElementById('lvl').textContent = 'LV ' + level;

  // 16 element habitats
  HABITATS.forEach(function (pos, i) {
    var e = ELEMENTS[i], unlockAt = i + 1, open = level >= unlockAt;
    var g = el('g', { class: 'plot', style: 'color:' + e[1] }, plotLayer);
    el('polygon', { class: 'hex', points: hexPoints(pos[0], pos[1], 30), fill: open ? e[1] : '#0b1426', 'fill-opacity': open ? .28 : .85,
      stroke: open ? e[1] : '#2a3a5a', 'stroke-width': open ? 3 : 2, 'stroke-dasharray': open ? '' : '5 4' }, g);
    if (open) {
      // A tiny "habitat" glyph: little roof + den
      el('path', { d: 'M' + (pos[0] - 14) + ' ' + (pos[1] + 4) + ' L' + pos[0] + ' ' + (pos[1] - 12) + ' L' + (pos[0] + 14) + ' ' + (pos[1] + 4) + ' Z', fill: e[1] }, g);
      el('rect', { x: pos[0] - 10, y: pos[1] + 4, width: 20, height: 11, fill: e[1], opacity: .7 }, g);
      label(pos[0], pos[1] + 46, e[0].toUpperCase(), 11, e[1], g);
    } else {
      label(pos[0], pos[1] + 5, 'LV ' + unlockAt, 12, '#5b7096', g);
    }
    addTip(g, '<b>' + e[0] + ' Habitat</b><br>' + (open ? 'Unlocked. Upgrading adds new structures inside the habitat.' : 'Unlocks at player level ' + unlockAt + '.'));
  });

  // Core buildings
  BUILDINGS.forEach(function (b) {
    var g = el('g', { class: 'plot', style: 'color:#6be6ff' }, plotLayer);
    el('polygon', { class: 'hex', points: hexPoints(b[0], b[1], b[2]), fill: '#0d2350', 'fill-opacity': .92, stroke: '#4aa3ff', 'stroke-width': 3 }, g);
    el('polygon', { points: hexPoints(b[0], b[1], b[2] - 8), fill: 'none', stroke: '#6be6ff', 'stroke-opacity': .5, 'stroke-width': 1.5 }, g);
    label(b[0], b[1] + 6, b[5], b[2] > 50 ? 22 : 15, '#ffffff', g);
    label(b[0], b[1] + b[2] + 18, b[3].toUpperCase(), 12, '#6be6ff', g);
    addTip(g, '<b>' + b[3] + '</b><br>' + b[4]);
  });

  // Hero Shrine: 3 altars on the dragon's head (unlock at levels 5, 10, 15 in this concept)
  var hero = el('g', { class: 'plot', style: 'color:#f5b942' }, plotLayer);
  HERO_ALTARS.forEach(function (a, i) {
    var open = level >= (i + 1) * 5;
    el('polygon', { class: 'hex', points: hexPoints(a[0], a[1], 19), fill: open ? '#f5b942' : '#0b1426', 'fill-opacity': open ? .35 : .85, stroke: open ? '#f5b942' : '#5b4a2a', 'stroke-width': 2.5 }, hero);
    label(a[0], a[1] + 5, open ? '★' : String((i + 1) * 5), 12, open ? '#ffe2a0' : '#8a7444', hero);
  });
  label(190, 430, 'HERO SHRINE', 12, '#f5b942', hero);
  addTip(hero, '<b>Hero Shrine</b><br>Up to 3 Hero dragons of the highest rarity. Concept: one altar unlocks at levels 5, 10 and 15.');

  // Status line (System style)
  label(1180, 60, 'ELEMENTS ' + Math.min(level, 16) + ' / 16', 18, '#6be6ff', plotLayer);
  if (level > 16) label(1180, 88, 'LEVEL-UPS NOW GRANT GOLD', 13, '#f5b942', plotLayer);
}

drawTerrain();
svg.appendChild(plotLayer);
var slider = document.getElementById('level');
slider.addEventListener('input', function () { drawPlots(Number(slider.value)); });
drawPlots(Number(slider.value));
</script>
</body>
</html>
