<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Dragon Village 3D</title>
<style>
  /* Concept: Clash-of-Clans-style village in real 3D, built from Kenney CC0 model kits.
     Three.js + models are local files (vendor/, assets/model-pack.js), so this works offline from file://. */
  :root { --panel: rgba(6,16,38,.88); --line: #1d5aa8; --line-hi: #4aa3ff; --text: #d6e8ff; --muted: #7f9bc4; --cyan: #6be6ff; --gold: #f5b942; --glow: rgba(74,163,255,.45); }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2b5427; font-family: "Bahnschrift", "Segoe UI", system-ui, sans-serif; color: var(--text); user-select: none; -webkit-user-select: none; }
  canvas { display: block; touch-action: none; }
  .win { position: fixed; background: var(--panel); border: 1px solid var(--line-hi); box-shadow: 0 0 16px var(--glow); backdrop-filter: blur(3px); }
  .profile { top: 12px; left: 12px; display: flex; align-items: center; gap: .7rem; padding: .5rem .8rem .5rem .5rem; }
  .lvl { width: 46px; height: 46px; display: grid; place-content: center; font: 800 1.2rem Consolas, monospace; color: #fff; background: rgba(30,90,200,.5);
         border: 1px solid var(--cyan); clip-path: polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%); text-shadow: 0 0 8px var(--cyan); }
  .pname { font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
  .psub { font-size: .7rem; letter-spacing: .14em; color: #9b7bff; text-transform: uppercase; }
  .xp { height: 5px; width: 130px; background: rgba(0,0,0,.5); border: 1px solid var(--line); margin-top: .3rem; }
  .xp i { display: block; height: 100%; width: 62%; background: linear-gradient(90deg, #1b56c8, var(--cyan)); box-shadow: 0 0 8px var(--glow); }
  .res { top: 12px; right: 12px; padding: .45rem .7rem; display: grid; gap: .35rem; min-width: 190px; }
  .res div { display: flex; justify-content: space-between; align-items: center; gap: 1rem; font: 700 .95rem Consolas, monospace; }
  .res small { font: 700 .68rem "Bahnschrift", sans-serif; letter-spacing: .16em; color: var(--muted); }
  .res .g { color: var(--gold); } .res .e { color: var(--cyan); }
  .btn { position: fixed; background: linear-gradient(180deg, rgba(60,130,255,.6), rgba(30,80,200,.6)); color: #fff; border: 1px solid var(--line-hi);
         font: 800 .95rem "Bahnschrift", sans-serif; letter-spacing: .16em; text-transform: uppercase; cursor: pointer; box-shadow: 0 0 16px var(--glow); text-shadow: 0 0 8px var(--cyan); }
  .btn:hover { border-color: var(--cyan); box-shadow: 0 0 22px var(--glow); }
  .btn.on { background: linear-gradient(180deg, rgba(245,185,66,.75), rgba(180,120,20,.75)); border-color: var(--gold); }
  .build { right: 12px; bottom: 12px; width: 120px; height: 64px; font-size: 1.05rem; }
  .shop { right: 12px; bottom: 86px; width: 120px; height: 44px; }
  .quests { left: 12px; bottom: 12px; width: 120px; height: 64px; background: rgba(6,16,38,.88); }
  .zoom { position: fixed; right: 144px; bottom: 12px; display: grid; gap: 6px; }
  .zoom .btn, .thsel .btn { position: static; }
  .zoom .btn { width: 40px; height: 40px; font-size: 1.3rem; letter-spacing: 0; }
  .thsel { left: 144px; bottom: 12px; padding: .4rem .5rem; display: flex; align-items: center; gap: .35rem; }
  .thsel span { font-size: .68rem; letter-spacing: .16em; color: var(--muted); margin-right: .2rem; }
  .thsel .btn { width: 38px; height: 34px; font-size: .8rem; letter-spacing: .04em; }
  .info { left: 50%; bottom: 90px; transform: translateX(-50%); padding: .6rem .9rem; display: none; text-align: center; min-width: 260px; max-width: 92vw; }
  .info h3 { margin: 0 0 .15rem; font-size: .95rem; letter-spacing: .16em; text-transform: uppercase; color: var(--cyan); text-shadow: 0 0 10px var(--glow); }
  .info p { margin: .2rem 0 .5rem; font-size: .8rem; }
  .info .btn { position: static; padding: .45rem .9rem; font-size: .75rem; margin: 0 .2rem; }
  .toast { top: 84px; left: 50%; transform: translateX(-50%); padding: .5rem .9rem; font: .8rem Consolas, monospace; display: none; }
  .loading { position: fixed; inset: 0; display: grid; place-content: center; background: #02050d; color: var(--cyan); letter-spacing: .3em; font-weight: 700; z-index: 10; }
  @media (max-width: 700px) { .res { min-width: 150px; } .xp { width: 90px; } .thsel { left: 12px; bottom: 86px; } .zoom { right: 140px; } }
</style>
</head>
<body>
<div class="loading" id="loading">[ SYSTEM ] LOADING VILLAGE…</div>
<div class="win profile"><div class="lvl">6</div><div><div class="pname">Hunter</div><div class="psub">Rank D · Apprentice Mage</div><div class="xp"><i></i></div></div></div>
<div class="win res"><div><small>GOLD</small><span class="g">545 G</span></div><div><small>ELEMENTS</small><span class="e">5 / 16</span></div></div>
<button class="btn quests" type="button" onclick="location.href='../index.html'">◂ Quests</button>
<div class="win thsel" id="thsel"><span>TOWN HALL</span></div>
<div class="zoom"><button class="btn" id="zin" type="button" aria-label="Zoom in">+</button><button class="btn" id="zout" type="button" aria-label="Zoom out">−</button></div>
<button class="btn shop" type="button" data-toast="Shop: concept only">Shop</button>
<button class="btn build" type="button" data-toast="Build menu: concept only">Build</button>
<div class="win info" id="info"><h3 id="infoName"></h3><p id="infoText"></p>
  <button class="btn" type="button" data-toast="Info: concept only">Info</button><button class="btn" type="button" data-toast="Upgrade: concept only">Upgrade</button></div>
<div class="win toast" id="toast"></div>

<script src="../vendor/three/three.min.js"></script>
<script src="../vendor/three/OrbitControls.js"></script>
<script src="../vendor/three/GLTFLoader.js"></script>
<script src="../assets/model-pack.js"></script>
<script>
/* ============================ Renderer, camera, lights ============================ */
var GRID = 20, HALF = GRID / 2;
function col(hex) { return new THREE.Color(hex).convertSRGBToLinear(); }   // our hex colours are sRGB
var renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
document.body.prepend(renderer.domElement);

var scene = new THREE.Scene();
// Sky: vertical gradient painted into a canvas (deep blue overhead → pale haze at the horizon).
scene.background = (function () {
  var c = document.createElement('canvas'); c.width = 4; c.height = 512;
  var x = c.getContext('2d'), g = x.createLinearGradient(0, 0, 0, 512);
  g.addColorStop(0, '#2a74c4'); g.addColorStop(0.4, '#6fb6ea'); g.addColorStop(0.75, '#bfe2fb'); g.addColorStop(1, '#e8f5ff');
  x.fillStyle = g; x.fillRect(0, 0, 4, 512);
  var tex = new THREE.CanvasTexture(c); tex.encoding = THREE.sRGBEncoding; return tex;
})();
scene.fog = new THREE.Fog(col('#cfe8fb'), 75, 175);        // far islands fade into the haze

// Fixed Clash-of-Clans angle: zoom + pan only, never rotate.
var camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.5, 300);
camera.position.copy(new THREE.Vector3(1, 1.35, 1).normalize().multiplyScalar(66));   // start wide enough to see the island
var controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableRotate = false;
controls.screenSpacePanning = false;
controls.mouseButtons = { LEFT: THREE.MOUSE.PAN, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.PAN };
controls.touches = { ONE: THREE.TOUCH.PAN, TWO: THREE.TOUCH.DOLLY_PAN };
controls.minDistance = 14; controls.maxDistance = 88;
controls.enableDamping = true; controls.dampingFactor = 0.12;
var PAN_LIMIT = 16;
controls.addEventListener('change', function () {
  var t = controls.target, x = Math.max(-PAN_LIMIT, Math.min(PAN_LIMIT, t.x)), z = Math.max(-PAN_LIMIT, Math.min(PAN_LIMIT, t.z));
  var dx = x - t.x, dz = z - t.z;
  if (dx || dz) { t.x += dx; t.z += dz; camera.position.x += dx; camera.position.z += dz; }
});
function zoomBy(f) {
  var off = camera.position.clone().sub(controls.target);
  camera.position.copy(controls.target).add(off.setLength(Math.max(controls.minDistance, Math.min(controls.maxDistance, off.length() * f))));
}
document.getElementById('zin').onclick = function () { zoomBy(0.8); };
document.getElementById('zout').onclick = function () { zoomBy(1.25); };

scene.add(new THREE.HemisphereLight('#e2f2ff', '#8a9aa6', 0.8));   // sky above, pale cloud-light below
var sun = new THREE.DirectionalLight('#fff1d6', 1.05);
sun.position.set(-14, 26, 10); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -16, right: 16, top: 16, bottom: -16, near: 1, far: 80 });
sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.02;
scene.add(sun);

/* ============================ Kit model loading ============================ */
var KIT = {};
// The Nature kit uses a mint/teal palette; remap its materials (by name) to Clash-of-Clans-like colours.
var PALETTE = {
  leafsGreen: '#4f9e3a', leafsDark: '#2f6e34', leafsFall: '#c9852f', grass: '#5fae45',
  woodBark: '#7a5232', woodBarkDark: '#5e3d26', woodInner: '#d9b98a', dirt: '#8a6a45',
  stone: '#a3a8aa', stoneDark: '#767d80'
};
function loadKits(done) {
  var pack = window.MODEL_PACK, keys = Object.keys(pack.glb), left = keys.length;
  var manager = new THREE.LoadingManager();
  // Models reference "Textures/colormap.png": serve the embedded data-URI version instead.
  manager.setURLModifier(function (url) {
    for (var k in pack.tex) if (url.slice(-k.length) === k) return pack.tex[k];
    return url;
  });
  var loader = new THREE.GLTFLoader(manager);
  keys.forEach(function (key) {
    var bin = atob(pack.glb[key]), buf = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
    loader.parse(buf.buffer, key.split('/')[0] + '/', function (gltf) {
      gltf.scene.traverse(function (o) { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; o.material.metalness = 0; o.material.roughness = Math.max(0.7, o.material.roughness);
        if (PALETTE[o.material.name]) o.material.color.copy(col(PALETTE[o.material.name])); } });
      KIT[key.split('/')[1]] = gltf.scene;
      if (--left === 0) done();
    }, function (err) { console.error('Model failed', key, err); if (--left === 0) done(); });
  });
}
// Place a kit piece: kit(name, x, y, z, rotationY, scale, parent)
function kit(name, x, y, z, rot, scale, parent) {
  var src = KIT[name];
  if (!src) { console.warn('missing', name); return new THREE.Group(); }
  var o = src.clone(true);
  o.position.set(x, y, z); o.rotation.y = rot || 0;
  if (scale) typeof scale === 'number' ? o.scale.setScalar(scale) : o.scale.set(scale[0], scale[1], scale[2]);
  parent.add(o); return o;
}
// Recolour a piece (materials are cloned so other copies keep their colours).
function tint(o, color) {
  o.traverse(function (m) { if (m.isMesh) { m.material = m.material.clone(); m.material.color.copy(col(color)); } });
  return o;
}
function glow(geo, color, intensity, x, y, z, parent) {
  var m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: col(color), emissive: col(color), emissiveIntensity: intensity || 1, roughness: 0.35 }));
  m.position.set(x, y, z); m.castShadow = true; parent.add(m); return m;
}
function egg(color, x, y, z, parent, s) {
  var e = new THREE.Mesh(new THREE.SphereGeometry(0.3 * (s || 1), 20, 16), new THREE.MeshStandardMaterial({ color: col(color), roughness: 0.35 }));
  e.scale.y = 1.35; e.position.set(x, y, z); e.castShadow = true; parent.add(e); return e;
}
var rng = (function (s) { return function () { s |= 0; s = s + 0x6D2B79F5 | 0; var t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; })(11);

/* ============================ Town Hall levels ============================
   Built on a 3x3 "module" grid (one castle-kit piece = 1 module), then scaled to the 4x4-tile footprint.
   Each level visibly adds to the previous one.
   HEIGHT CAP: no level may be taller than level 3 (keep top ~4.1 modules). Later levels grow in width and detail. */
// Small stone-and-wood hall (Fantasy Town kit). Wall panels sit on a tile's +x edge; rotate to use other sides.
function hall(parent, x, z, s) {
  var h = new THREE.Group(); h.position.set(x, 0, z); h.scale.setScalar(s); parent.add(h);
  kit('wall-window-stone', 0, 0, 0, 0, null, h);               // +x side (faces the camera)
  kit('wall-door', 0, 0, 0, -Math.PI / 2, null, h);            // +z side (faces the camera)
  kit('wall', 0, 0, 0, Math.PI, null, h);
  kit('wall', 0, 0, 0, Math.PI / 2, null, h);
  kit('roof-high-point', 0, 1, 0, 0, null, h);
  kit('chimney', 0, 1.15, 0, Math.PI / 2, null, h);
  return h;
}
function keep(parent, pieces, x, z) {                          // stack castle tower pieces bottom-up
  var y = 0, heights = { 'tower-square-base': 1.01, 'tower-square-base-color': 1.01, 'tower-square-base-border': 0.45, 'tower-square-mid': 1.01,
    'tower-square-mid-windows': 1.01, 'tower-square-mid-door': 1.01, 'tower-square-mid-color': 0.2, 'tower-square-top': 0.3, 'tower-square-top-color': 0.38,
    'tower-hexagon-base': 1.31, 'tower-hexagon-mid': 0.46, 'tower-hexagon-top': 0.13, 'tower-base': 1.31 };
  pieces.forEach(function (p) { kit(p, x, y, z, 0, null, parent); y += heights[p] || 0; });
  return y;                                                     // height of the top
}
function crystal(parent, y, size) {
  var c = glow(new THREE.OctahedronGeometry(0.22 * size, 0), '#6be6ff', 1.3, 0, y, 0, parent);
  c.userData.bob = y;
  var l = new THREE.PointLight('#6be6ff', 0.9, 5); l.position.set(0, y, 0); parent.add(l);
  return c;
}
var TOWN_HALLS = {
  1: function (g) {          // Modest stone hall with lanterns
    hall(g, 0, 0, 1.6);
    kit('lantern', 1.15, 0, 1.15, 0, 0.9, g); kit('lantern', -1.15, 0, 1.15, 0, 0.9, g);
    kit('banner-red', 0.2, 0.25, 0, 0, 0.9, g);
    kit('flower_redA', 1.1, 0, -0.9, 0, 2, g); kit('plant_bush', -1.1, 0, -1, 0, 2, g);
  },
  2: function (g) {          // Stone keep tower + the old hall as an annex
    var top = keep(g, ['tower-square-base', 'tower-square-mid-windows'], -0.45, -0.45);
    kit('tower-square-top-roof-high', -0.45, top, -0.45, 0, null, g);
    kit('flag', -0.45, top + 1.3, -0.45, 0, null, g);
    hall(g, 0.75, 0.75, 1.05);
    kit('lantern', 1.35, 0, -0.2, 0, 0.8, g); kit('lantern', -0.2, 0, 1.35, 0, 0.8, g);
    kit('banner-red', -0.45, 1.2, -0.45, 0, null, g);
  },
  3: function (g) {          // Walled keep with corner towers and a gate
    var top = keep(g, ['tower-square-base-color', 'tower-square-mid-windows', 'tower-square-mid'], 0, 0);
    kit('tower-square-top-roof-high-windows', 0, top, 0, 0, null, g);
    crystal(g, top + 1.45, 1);
    [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(function (p) {
      var t = keep(g, ['tower-hexagon-base'], p[0], p[1]); kit('tower-hexagon-roof', p[0], t, p[1], 0, null, g);
    });
    kit('wall-corner', 0, 0, -1, 0, [1, 0.65, 1], g); kit('wall-corner', -1, 0, 0, 0, [1, 0.65, 1], g); kit('wall-corner', 1, 0, 0, 0, [1, 0.65, 1], g);
    kit('gate', 0, 0, 1, Math.PI / 2, null, g);
    kit('flag-banner-long', 0.5, 0.6, 0, 0, null, g);
  },
  4: function (g) {          // Grand citadel: NOT taller than level 3 (height cap); grows in richness instead
    var top = keep(g, ['tower-square-base-border', 'tower-square-base-color', 'tower-square-mid-windows', 'tower-square-mid-color', 'tower-square-top-color'], 0, 0);
    kit('tower-square-top-roof-rounded', 0, top, 0, 0, null, g);                       // keep ends ~4.0 high (level 3: ~4.1)
    crystal(g, top + 1.25, 1.5);
    [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(function (p) {
      var t = keep(g, ['tower-hexagon-base', 'tower-hexagon-mid'], p[0], p[1]);        // two-storey corner towers
      kit('tower-hexagon-roof', p[0], t, p[1], 0, null, g);
      kit('flag-wide', p[0], t + 0.8, p[1], Math.PI / 4, null, g);
    });
    kit('wall-corner', 0, 0, -1, 0, [1, 0.65, 1], g); kit('wall-corner', -1, 0, 0, 0, [1, 0.65, 1], g); kit('wall-corner', 1, 0, 0, 0, [1, 0.65, 1], g);
    kit('gate', 0, 0, 1, Math.PI / 2, null, g);
    kit('stairs-stone', 0, 0, 1.45, 0, [0.9, 0.5, 0.6], g);                            // steps up to the gate
    kit('flag-banner-long', 0.5, 0.6, 0, 0, null, g); kit('flag-banner-long', 0, 0.6, 0.5, -Math.PI / 2, null, g);
    kit('lantern', 1.5, 0, 0.55, 0, 0.7, g); kit('lantern', 0.55, 0, 1.5, 0, 0.7, g);
  }
};
var thLevel = 4;

/* ============================ Buildings ============================ */
function habitat(color, decorate) {
  return function (g) {
    var base = kit('platform_stone', 0, 0.05, 0, 0, [3.2, 3, 3.9], g);
    var ring = glow(new THREE.TorusGeometry(1.28, 0.05, 6, 32), color, 0.8, 0, 0.18, 0, g); ring.rotation.x = Math.PI / 2;
    decorate(g);
  };
}
var DESC = {
  habitat: 'Home for dragons of this element. Upgrading adds new structures inside.',
  townhall: 'Heart of the village. Its level follows your player level and unlocks buildings.',
  lab: 'Researches dragon evolution (Egg → Hatchling → Juvenile → Adult).',
  camp: 'Levels dragons up, one at a time, like the Clash of Clans Laboratory.',
  hatchery: 'Breeding nest: produces a new egg when you want one.',
  altar: 'Hero altar: home of one of up to 3 Hero dragons.'
};
var MODELS = {
  townhall: { size: 4, name: 'Town Hall', desc: DESC.townhall, build: function (g) {
    var inner = new THREE.Group(); inner.scale.setScalar(1.25); g.add(inner);
    TOWN_HALLS[thLevel](inner);
  } },
  fire: { size: 3, name: 'Fire Habitat', desc: DESC.habitat, build: habitat('#ff5a36', function (g) {
    tint(kit('rock_tallA', -0.75, 0.1, -0.6, 0.4, 1.6, g), '#6b3a2a'); tint(kit('rock_tallB', 0.75, 0.1, -0.8, 2, 1.2, g), '#6b3a2a');
    var lava = glow(new THREE.CylinderGeometry(0.55, 0.55, 0.05, 24), '#ff6a1a', 1.1, -0.1, 0.17, 0.25, g);
    var l = new THREE.PointLight('#ff6a1a', 1, 4); l.position.set(-0.1, 0.8, 0.25); g.add(l);
  }) },
  ice: { size: 3, name: 'Ice Habitat', desc: DESC.habitat, build: habitat('#8fe3ff', function (g) {
    tint(kit('rock_tallC', -0.7, 0.1, -0.7, 0.2, 1.5, g), '#d8f6ff'); tint(kit('rock_tallA', 0.8, 0.1, -0.55, 1.4, 1.1, g), '#bfeaff');
    tint(kit('stone_tallA', -0.85, 0.1, 0.6, 0.8, 1.2, g), '#e6fbff');
  }) },
  forest: { size: 3, name: 'Forest Habitat', desc: DESC.habitat, build: habitat('#3fbf5a', function (g) {
    kit('tree_oak', -0.75, 0.1, -0.7, 0, 1.6, g); kit('plant_bushDetailed', 0.8, 0.1, -0.7, 0, 1.6, g);
    kit('mushroom_redGroup', -0.8, 0.1, 0.7, 0, 2, g); kit('flower_yellowA', 0.8, 0.1, 0.75, 0, 2, g); kit('flower_purpleA', 0.6, 0.1, 0.95, 0, 2, g);
  }) },
  storm: { size: 3, name: 'Storm Habitat', desc: DESC.habitat, build: habitat('#8a7dff', function (g) {
    tint(kit('rock_tallB', -0.7, 0.1, -0.7, 0.6, 1.5, g), '#4b4766');
    [[-0.7, 2.2, -0.7, 0.45], [-0.35, 2.1, -0.6, 0.32], [-0.95, 2.05, -0.4, 0.3]].forEach(function (c) {
      var cl = new THREE.Mesh(new THREE.SphereGeometry(c[3], 10, 8), new THREE.MeshStandardMaterial({ color: col('#5b5670'), flatShading: true }));
      cl.position.set(c[0], c[1], c[2]); cl.castShadow = true; g.add(cl);
    });
    glow(new THREE.OctahedronGeometry(0.15, 0), '#ffe14d', 1.4, -0.7, 1.75, -0.7, g);
  }) },
  cosmic: { size: 3, name: 'Cosmic Habitat', desc: DESC.habitat, build: habitat('#c04dff', function (g) {
    tint(kit('statue_ring', -0.6, 0.1, -0.6, Math.PI / 4, 1.8, g), '#6a4bd8'); tint(kit('statue_obelisk', 0.85, 0.1, -0.75, 0, 1.5, g), '#4a3680');
    glow(new THREE.SphereGeometry(0.2, 16, 12), '#e6a0ff', 1.2, -0.6, 0.95, -0.6, g);
  }) },
  lab: { size: 2, name: 'Research Lab', desc: DESC.lab, build: function (g) {
    var h = hall(g, 0, 0, 1.3);
    kit('statue_column', 0.75, 0, 0.75, 0, 1.3, g);
    glow(new THREE.SphereGeometry(0.16, 16, 12), '#9b7bff', 1.4, 0.75, 1.42, 0.75, g);
    var l = new THREE.PointLight('#9b7bff', 0.8, 3); l.position.set(0.75, 1.5, 0.75); g.add(l);
  } },
  camp: { size: 3, name: 'Training Camp', desc: DESC.camp, build: function (g) {

/* ============================ Sky-island scenery ============================
   Inspired by the "floating islands above the clouds" mood board (own design, no copied art).
   Everything below is procedural geometry + Kenney CC0 kit pieces. */
var ANIMS = [];                                   // per-frame animations: fn(time, deltaTime)
var MAIN_R = 19;                                  // main island radius (the 20x20 base fits inside)

// Irregular floating island: flat grassy top + craggy rock underside tapering to a point.
// Returns { mesh, outline(angle) -> rim radius }.
function makeIsland(radius, depth, seg) {
  seg = seg || 56;
  var ph = [rng() * 6, rng() * 6, rng() * 6];
  function outline(a) { return radius * (1 + 0.07 * Math.sin(3 * a + ph[0]) + 0.05 * Math.sin(5 * a + ph[1]) + 0.03 * Math.sin(9 * a + ph[2])); }
  // Rings from the rim down to the tip: [height, radius factor, colour]
  var RINGS = [[0, 1, '#5fa83f'], [-0.35, 1.03, '#4f8f35'], [-0.9, 0.99, '#8a6a45'], [-depth * 0.22, 0.88, '#9c9488'],
               [-depth * 0.48, 0.64, '#857e74'], [-depth * 0.74, 0.36, '#6d675f'], [-depth, 0.05, '#57524c']];
  var V = RINGS.map(function (rg, k) {
    var row = [];
    for (var i = 0; i < seg; i++) {
      var a = i / seg * Math.PI * 2, rough = k >= 3 ? 0.86 + rng() * 0.28 : 1;
      var r = outline(a) * rg[1] * rough, y = rg[0] + (k >= 3 && k < RINGS.length - 1 ? (rng() - 0.5) * depth * 0.09 : 0);
      row.push(new THREE.Vector3(Math.cos(a) * r, y, Math.sin(a) * r));
    }
    return row;
  });
  var pos = [], cols = [];
  function tri(a, b, c, color) {
    pos.push(a.x, a.y, a.z, b.x, b.y, b.z, c.x, c.y, c.z);
    for (var n = 0; n < 3; n++) cols.push(color.r, color.g, color.b);
  }
  var top = col(RINGS[0][2]), centre = new THREE.Vector3(0, 0, 0);
  for (var i = 0; i < seg; i++) tri(centre, V[0][(i + 1) % seg], V[0][i], top);              // grassy top
  for (var k = 0; k < RINGS.length - 1; k++) {
    for (var j = 0; j < seg; j++) {
      var j2 = (j + 1) % seg, c = col(RINGS[k + 1][2]).multiplyScalar(0.85 + rng() * 0.3);       // faceted rock shading
      tri(V[k][j], V[k][j2], V[k + 1][j], c); tri(V[k][j2], V[k + 1][j2], V[k + 1][j], c);
    }
  }
  var geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  geo.computeVertexNormals();
  var mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 1, side: THREE.DoubleSide }));
  mesh.receiveShadow = true;
  return { mesh: mesh, outline: outline, rings: V };
}

// Fluffy cloud: a cluster of soft white spheres.
var cloudGeo = new THREE.SphereGeometry(1, 14, 10);
var cloudMat = new THREE.MeshStandardMaterial({ color: col('#ffffff'), emissive: col('#dfeefa'), emissiveIntensity: 0.2, roughness: 1 });
function cloud(x, y, z, s) {
  var g = new THREE.Group();
  for (var i = 0; i < 7; i++) {
    var p = new THREE.Mesh(cloudGeo, cloudMat), r = 0.6 + rng() * 0.7;
    p.position.set((rng() - 0.5) * 3.2, (rng() - 0.3) * 0.8, (rng() - 0.5) * 2); p.scale.setScalar(r); g.add(p);
  }
  g.position.set(x, y, z); g.scale.set(s, s * 0.6, s); scene.add(g); return g;
}

// Glowing crystal cluster (Solo Leveling touch on the islands).
function crystals(x, y, z, color, n, size, parent) {
  var g = new THREE.Group(); g.position.set(x, y, z); parent.add(g);
  for (var i = 0; i < n; i++) {
    var h = (0.6 + rng() * 0.9) * size;
    var c = glow(new THREE.ConeGeometry(0.16 * size, h, 5), color, 0.9, (rng() - 0.5) * 0.8 * size, h / 2, (rng() - 0.5) * 0.8 * size, g);
    c.rotation.z = (rng() - 0.5) * 0.6; c.rotation.x = (rng() - 0.5) * 0.6;
  }
  return g;
}

// Hanging chain made of alternating torus links, sagging between two points.
function chain(a, b, sag) {
  var linkGeo = new THREE.TorusGeometry(0.16, 0.045, 6, 12), linkMat = new THREE.MeshStandardMaterial({ color: col('#5a5f66'), metalness: 0.6, roughness: 0.45 });
  var n = Math.ceil(a.distanceTo(b) / 0.26), prev = a.clone();
  for (var i = 1; i <= n; i++) {
    var t = i / n, p = a.clone().lerp(b, t); p.y -= Math.sin(t * Math.PI) * sag;
    var link = new THREE.Mesh(linkGeo, linkMat);
    link.position.copy(p); link.lookAt(prev); if (i % 2) link.rotateZ(Math.PI / 2);
    scene.add(link); prev = p;
  }
}

// Animated waterfall texture: soft vertical streaks scrolled every frame.
function waterTexture() {
  var c = document.createElement('canvas'); c.width = 64; c.height = 256;
  var x = c.getContext('2d');
  x.fillStyle = 'rgba(120,200,250,0.85)'; x.fillRect(0, 0, 64, 256);
  for (var i = 0; i < 70; i++) {
    x.fillStyle = 'rgba(255,255,255,' + (0.25 + Math.random() * 0.6) + ')';
    x.fillRect(Math.random() * 64, Math.random() * 256, 1 + Math.random() * 3, 20 + Math.random() * 60);
  }
  var tex = new THREE.CanvasTexture(c); tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.encoding = THREE.sRGBEncoding;

// Low-poly dragon that circles the island, flapping its wings.
function flyingDragon(color, radius, height, speed, phase) {
  var g = new THREE.Group(), body = new THREE.MeshStandardMaterial({ color: col(color), roughness: 0.6, flatShading: true });
  var belly = new THREE.MeshStandardMaterial({ color: col('#e8d8b0'), roughness: 0.7, flatShading: true });
  var torso = new THREE.Mesh(new THREE.SphereGeometry(0.8, 10, 8), body); torso.scale.set(1.8, 0.75, 0.75); g.add(torso);
  var neck = new THREE.Mesh(new THREE.ConeGeometry(0.35, 1.4, 7), body); neck.rotation.z = -Math.PI / 2.6; neck.position.set(1.5, 0.45, 0); g.add(neck);
  var head = new THREE.Mesh(new THREE.SphereGeometry(0.42, 9, 7), body); head.scale.set(1.5, 0.9, 0.9); head.position.set(2.2, 0.85, 0); g.add(head);
  [-0.18, 0.18].forEach(function (z) {
    var horn = new THREE.Mesh(new THREE.ConeGeometry(0.08, 0.5, 5), belly); horn.position.set(2.0, 1.25, z); horn.rotation.z = 0.5; g.add(horn);
    glow(new THREE.SphereGeometry(0.06, 6, 6), '#ffe14d', 1.5, 2.55, 0.98, z * 1.3, g);
  });
  var tail = new THREE.Mesh(new THREE.ConeGeometry(0.32, 2.8, 7), body); tail.rotation.z = Math.PI / 2; tail.position.set(-2.6, 0.1, 0); g.add(tail);
  var wingShape = new THREE.BufferGeometry();
  wingShape.setAttribute('position', new THREE.Float32BufferAttribute([0, 0, 0, 1.2, 0, 0.3, -0.4, 0, 3.4, 1.2, 0, 0.3, 1.0, 0, 2.6, -0.4, 0, 3.4, -0.4, 0, 3.4, -1.0, 0, 2.2, 0, 0, 0], 3));
  wingShape.computeVertexNormals();
  var wingMat = new THREE.MeshStandardMaterial({ color: col(color), roughness: 0.7, side: THREE.DoubleSide, flatShading: true });
  var wings = [1, -1].map(function (side) {
    var pivot = new THREE.Group(); pivot.position.set(0.2, 0.35, 0); g.add(pivot);
    var w = new THREE.Mesh(wingShape, wingMat); w.scale.z = side; pivot.add(w);

    g.rotation.y = -a - Math.PI / 2;                              // face along the flight path
    g.rotation.z = Math.sin(t * 0.8 + phase) * 0.12;

  });
}

function buildSkyWorld() {

  for (var v = 0; v < 70; v++) {

  }
  for (var c = 0; c < 9; c++) {

    crystals(cv.x * 0.97, cv.y - 0.3, cv.z * 0.97, rng() < 0.5 ? '#6be6ff' : '#b06bff', 4, 1.1, scene).rotation.x = Math.PI;
  }

  // Pond + stream + waterfall pouring off the front-left edge (visible from the default camera).
  var waterTex = waterTexture(), streamTex = waterTex.clone(); streamTex.needsUpdate = true;
  var waterMat = new THREE.MeshStandardMaterial({ color: col('#4fb2ea'), emissive: col('#1f6fa8'), emissiveIntensity: 0.25, roughness: 0.15, metalness: 0.1 });
  var pond = new THREE.Mesh(new THREE.CircleGeometry(2.3, 24), waterMat); pond.rotation.x = -Math.PI / 2; pond.position.set(-3, 0.02, 13.6); scene.add(pond);
  var edgeZ = 14; while (Math.hypot(-3, edgeZ) < main.outline(Math.atan2(edgeZ, -3)) - 0.05) edgeZ += 0.05;
  var streamLen = edgeZ - 15.4;
  var stream = new THREE.Mesh(new THREE.PlaneGeometry(1.5, streamLen), new THREE.MeshStandardMaterial({ map: streamTex, transparent: true, roughness: 0.2 }));
  stream.rotation.x = -Math.PI / 2; stream.position.set(-3, 0.03, 15.4 + streamLen / 2); scene.add(stream);
  var fall = new THREE.Mesh(new THREE.PlaneGeometry(1.8, 24), new THREE.MeshStandardMaterial({ map: waterTex, transparent: true, opacity: 0.9, depthWrite: false, side: THREE.DoubleSide, emissive: col('#9fd8ff'), emissiveIntensity: 0.35 }));
  fall.position.set(-3, -12, edgeZ + 0.25); scene.add(fall);
  waterTex.repeat.set(1, 3);
  ANIMS.push(function (t, dt) { waterTex.offset.y += dt * 0.9; streamTex.offset.y -= dt * 0.35; });
  [[-3, -0.2, edgeZ + 0.5, 1.2], [-3, -23, edgeZ + 1.5, 3]].forEach(function (m) { cloud(m[0], m[1], m[2], m[3]); });   // spray + mist

  // Rim vegetation: trees, bushes, rocks, flowers and crystals between the base and the edge.
  var trees = ['tree_default', 'tree_oak', 'tree_fat', 'tree_pineTallA', 'tree_pineRoundA', 'tree_pineDefaultA', 'tree_default_dark', 'tree_oak_dark'];
  var small = ['plant_bushDetailed', 'plant_bush', 'flower_redA', 'flower_yellowA', 'flower_purpleA', 'rock_largeA', 'stone_largeA', 'mushroom_redGroup', 'stump_round', 'grass_large'];
  for (var k = 0; k < 520; k++) {
    var ka = rng() * Math.PI * 2, kr = 10.6 + rng() * (main.outline(ka) - 11.4);
    var x = Math.cos(ka) * kr, z = Math.sin(ka) * kr;
    if (Math.abs(x) < HALF + 0.6 && Math.abs(z) < HALF + 0.6) continue;           // keep the base clear
    if (Math.hypot(x + 3, z - 13.6) < 2.8 || (Math.abs(x + 3) < 1.3 && z > 13)) continue;   // pond + stream
    var front = x + z > 21;                                                          // camera side: low plants only
    if (!front && rng() < 0.45) {
      var tr = kit(trees[Math.floor(rng() * trees.length)], x, 0, z, rng() * 6, 2 + rng() * 1.3, scene);

    } else if (rng() < 0.06) crystals(x, 0, z, rng() < 0.5 ? '#6be6ff' : '#b06bff', 3, 0.9, scene);
    else kit(small[Math.floor(rng() * small.length)], x, 0, z, rng() * 6, 1.8 + rng(), scene);
  }

  /* ---- Satellite islands (gently bobbing) ---- */
  function satellite(x, y, z, r, depth, decorate) {

    g.add(isl.mesh); g.position.set(x, y, z); scene.add(g);
    if (decorate) decorate(g, isl);

  }
  // Ruined watch-tower island with its own little waterfall
  satellite(-36, -3, 8, 6.5, 10, function (g) {

    var f = new THREE.Mesh(new THREE.PlaneGeometry(1.1, 12), fall.material); f.position.set(2, -6, 6.6); g.add(f);
  });
  // Crystal island
  satellite(30, -9, -26, 5, 8, function (g) {
    crystals(0, 0, 0, '#b06bff', 9, 2.2, g); crystals(2.2, 0, 1.5, '#6be6ff', 5, 1.4, g);
    var l = new THREE.PointLight('#b06bff', 1.4, 14); l.position.set(0, 3, 0); g.add(l);
    kit('rock_tallA', -2.5, 0, -1, 0, 2.5, g);
  });
  // Great-tree island

    kit('mushroom_redGroup', 2, 0, -3, 0, 3, g); kit('flower_yellowA', -2, 0, -3, 0, 3, g);
  });
  // White-spire palace island (elegant towers like the mood board, own design)
  satellite(38, -2, 12, 5.5, 9, function (g) {
    [[0, 0, 3], [-2.2, 1.6, 2], [2.1, -1.4, 2]].forEach(function (p) {
      var y0 = 0, s = 1.7;
      ['tower-hexagon-base', 'tower-hexagon-mid', 'tower-hexagon-mid'].slice(0, p[2]).forEach(function (piece) {
        tint(kit(piece, p[0], y0, p[1], 0, s, g), '#f4efe2'); y0 += (piece === 'tower-hexagon-base' ? 1.31 : 0.46) * s;
      });
      kit('tower-hexagon-roof', p[0], y0, p[1], 0, s, g);

    });
    glow(new THREE.OctahedronGeometry(0.5, 0), '#6be6ff', 1.2, 0, 8.2, 0, g).userData.bob = 8.2;
    kit('tree_default', -2.8, 0, -2.3, 0, 2.4, g);
  });

    var fa = rng() * Math.PI * 2, fd = MAIN_R + 5 + rng() * 22, fy = -6 + rng() * 10;
    var rockIsland = satellite(Math.cos(fa) * fd, fy, Math.sin(fa) * fd, 0.8 + rng() * 1.4, 2 + rng() * 3, function (g, isl) {

  var chained = [[-0.78, 6], [2.45, 6.5]];                                           // screen-right and screen-left of the island

    });

  ];
  for (var w = 6; w <= 13; w++) {
    [[w, 6], [w, 13], [6, w], [13, w]].forEach(function (p) {
      if (p[1] === 13 && (p[0] === 9 || p[0] === 10)) return;   // gate gap
      if (!buildings.some(function (b) { return b.type === 'wall' && b.x === p[0] && b.y === p[1]; })) buildings.push({ type: 'wall', x: p[0], y: p[1] });
    });
  }
  buildings.forEach(function (b) {
    b.group = new THREE.Group(); b.group.userData.building = b;
    MODELS[b.type].build(b.group);
    b.group.position.copy(worldPos(b, b.x, b.y));
    scene.add(b.group);
  });
  rebuildWalls();
}
function worldPos(b, x, y) { var s = MODELS[b.type].size; return new THREE.Vector3(x - HALF + s / 2, 0, y - HALF + s / 2); }

// Walls: one crenellated block per tile (Castle kit 'wall-corner').
function rebuildWalls() {
  var at = {};
  buildings.forEach(function (b) { if (b.type === 'wall') at[b.x + ',' + b.y] = true; });
  buildings.forEach(function (b) {
    if (b.type !== 'wall') return;
    while (b.group.children.length) b.group.remove(b.group.children[0]);
    // Every wall tile is a crenellated stone block, so neighbouring tiles join into one solid wall.
    kit('wall-corner', 0, 0, 0, 0, [1, 0.65, 1], b.group);
  });
}

function setTownHall(level) {
  thLevel = level;
  var th = buildings.filter(function (b) { return b.type === 'townhall'; })[0];
  while (th.group.children.length) th.group.remove(th.group.children[0]);
  MODELS.townhall.build(th.group);
  document.querySelectorAll('#thsel .btn').forEach(function (b) { b.classList.toggle('on', Number(b.dataset.l) === level); });
  if (selected === th) select(th);
}

/* ============================ Select & drag ============================ */
var ray = new THREE.Raycaster(), mouse = new THREE.Vector2(), groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
var pending = null, drag = null, selected = null;
var footprint = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ color: '#f5b942', transparent: true, opacity: 0.45, depthWrite: false }));
footprint.rotation.x = -Math.PI / 2; footprint.visible = false; scene.add(footprint);
function setMouse(e) { mouse.x = e.clientX / innerWidth * 2 - 1; mouse.y = -(e.clientY / innerHeight) * 2 + 1; ray.setFromCamera(mouse, camera); }
function groundHit() { var p = new THREE.Vector3(); return ray.ray.intersectPlane(groundPlane, p) ? p : null; }
function buildingAt(e) {
  setMouse(e);
  var hits = ray.intersectObjects(buildings.map(function (b) { return b.group; }), true);
  for (var i = 0; i < hits.length; i++) { var o = hits[i].object; while (o && !o.userData.building) o = o.parent; if (o) return o.userData.building; }
  return null;
}
function overlaps(b, x, y) {
  var s = MODELS[b.type].size;
  if (x < 0 || y < 0 || x + s > GRID || y + s > GRID) return true;
  return buildings.some(function (o) { if (o === b) return false; var t = MODELS[o.type].size; return x < o.x + t && x + s > o.x && y < o.y + t && y + s > o.y; });
}
function showFootprint(b, x, y, color) {
  var s = MODELS[b.type].size, p = worldPos(b, x, y);
  footprint.scale.set(s, s, 1); footprint.position.set(p.x, 0.03, p.z); footprint.material.color.copy(col(color)); footprint.visible = true;
}
function select(b) {
  selected = b;
  var info = document.getElementById('info');
  if (!b) { info.style.display = 'none'; footprint.visible = false; return; }
  var lvl = b.type === 'townhall' ? thLevel : 1;
  document.getElementById('infoName').textContent = MODELS[b.type].name + (b.type === 'wall' || b.type === 'tree' ? '' : ' · Level ' + lvl);
  document.getElementById('infoText').textContent = MODELS[b.type].desc;
  info.style.display = 'block';
  showFootprint(b, b.x, b.y, '#f5b942');
}
addEventListener('pointerdown', function (e) {                // capture phase: runs before the camera controls
  if (e.target !== renderer.domElement || !e.isPrimary || e.button > 0) return;
  var b = buildingAt(e);
  if (!b) { pending = { empty: true, x: e.clientX, y: e.clientY }; return; }
  e.stopPropagation();
  var p = groundHit();
  pending = { b: b, x: e.clientX, y: e.clientY, offX: p.x - b.group.position.x, offZ: p.z - b.group.position.z };
}, true);
addEventListener('pointermove', function (e) {
  if (!pending || pending.empty) return;
  if (!drag && Math.hypot(e.clientX - pending.x, e.clientY - pending.y) > 6) { drag = { b: pending.b, x: pending.b.x, y: pending.b.y, ok: true }; select(drag.b); }
  if (!drag) return;
  setMouse(e);
  var p = groundHit(); if (!p) return;
  var s = MODELS[drag.b.type].size;
  drag.x = Math.round(p.x - pending.offX + HALF - s / 2); drag.y = Math.round(p.z - pending.offZ + HALF - s / 2);
  drag.ok = !overlaps(drag.b, drag.x, drag.y);
  var wp = worldPos(drag.b, drag.x, drag.y); drag.b.group.position.set(wp.x, 0.3, wp.z);
  showFootprint(drag.b, drag.x, drag.y, drag.ok ? '#50ff8c' : '#ff4660');
});
addEventListener('pointerup', function (e) {
  if (!pending) return;
  var moved = Math.hypot(e.clientX - pending.x, e.clientY - pending.y) > 6;
  if (drag) {
    if (drag.ok) { drag.b.x = drag.x; drag.b.y = drag.y; }
    drag.b.group.position.copy(worldPos(drag.b, drag.b.x, drag.b.y));
    if (drag.b.type === 'wall') rebuildWalls();
    select(drag.b); drag = null;
  } else if (!moved) select(pending.empty ? null : pending.b);
  pending = null;
});

/* ============================ HUD ============================ */
var toastTimer;
document.querySelectorAll('[data-toast]').forEach(function (btn) {
  btn.addEventListener('click', function () {
    var t = document.getElementById('toast'); t.textContent = '[ SYSTEM ] ' + btn.dataset.toast; t.style.display = 'block';
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.style.display = 'none'; }, 1800);
  });
});
[1, 2, 3, 4].forEach(function (l) {
  var b = document.createElement('button'); b.className = 'btn'; b.type = 'button'; b.textContent = l; b.dataset.l = l;
  b.onclick = function () { setTownHall(l); }; document.getElementById('thsel').appendChild(b);
});

/* ============================ Start ============================ */
addEventListener('resize', function () { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
var clock = new THREE.Clock();
loadKits(function () {
  buildWorld();
  var q = /th=(\d)/.exec(location.search); setTownHall(q ? Number(q[1]) : 4);
  var zq = /zoom=([\d.]+)/.exec(location.search); if (zq) zoomBy(Number(zq[1]));   // e.g. ?th=2&zoom=0.4 for close-ups
  document.getElementById('loading').style.display = 'none';
  (function loop() {
    var dt = Math.min(clock.getDelta(), 0.1), t = clock.elapsedTime;
    controls.update();
    ANIMS.forEach(function (fn) { fn(t, dt); });
    scene.traverse(function (o) { if (o.userData.bob !== undefined) { o.position.y = o.userData.bob + Math.sin(t * 2 + o.id) * 0.06; o.rotation.y = t; } });
    renderer.render(scene, camera);
    requestAnimationFrame(loop);
  })();
});
</script>
</body>
</html>
