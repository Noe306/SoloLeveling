<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Dragon Gallery</title>
<!--
  Dragon Gallery: one viewer for every element's evolution chain.

  HOW IT FITS TOGETHER
    habitats/registry.js   the 16 elements (shared with the Habitat Gallery)
    dragons/registry.js    the 4 evolution stages + DRAGONS.register()
    dragons/dragonkit.js   DK: the procedural dragon + egg builder shared by every element
    dragons/<id>.js        one file per element: palette, proportions per stage, effects
    habitats/<id>.js       used by the "Home" view (dragon resting in its habitat)

  ADD A NEW DRAGON
    1. create dragons/<id>.js (copy the pattern of dragons/fire.js)
    2. add its id to DRAGON_FILES below

  URL OPTIONS (shareable, used for screenshots)
    ?el=fire          element
    &st=adult         egg | hatchling | juvenile | adult | all (whole chain side by side)
    &home=1           show the dragon resting in its habitat (highest designed level)
    &ui=0             hide all panels (clean screenshots)
    &spin             slowly turn the camera
-->
<style>
  :root {
    --void: #050a16; --panel: rgba(6, 16, 38, .86); --line: rgba(74, 163, 255, .45); --line-hi: #4aa3ff;
    --text: #d6e8ff; --muted: #7f9bc4; --cyan: #6be6ff; --glow: rgba(74, 163, 255, .45); --gold: #ffc24a;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: "Bahnschrift", "Segoe UI", system-ui, sans-serif; color: var(--text); background: #6fb6ea; }
  canvas { display: block; touch-action: none; }
  button { font: inherit; color: inherit; }

  .win { position: fixed; z-index: 2; background: var(--panel); border: 1px solid var(--line); box-shadow: 0 0 16px var(--glow), inset 0 0 18px rgba(74,163,255,.12); }
  .win::before, .win::after { content: ""; position: absolute; width: 12px; height: 12px; border: 2px solid var(--cyan); pointer-events: none; }
  .win::before { top: -2px; left: -2px; border-right: 0; border-bottom: 0; }
  .win::after { bottom: -2px; right: -2px; border-left: 0; border-top: 0; }
  .win h2 { margin: 0 0 .35rem; font-size: .72rem; letter-spacing: .28em; color: var(--muted); font-weight: 600; text-transform: uppercase; }

  #info { top: 12px; left: 12px; padding: .7rem 1rem; max-width: 340px; }
  #info .el { font-size: 1.25rem; font-weight: 800; letter-spacing: .22em; text-transform: uppercase; text-shadow: 0 0 10px var(--glow); }
  #info .meta { margin-top: .25rem; font-size: .82rem; color: var(--muted); line-height: 1.45; }
  #info .meta b { color: var(--text); font-weight: 600; }

  #elements { top: 12px; right: 12px; padding: .7rem; width: 268px; }
  #elements .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
  .chip { position: relative; padding: .42rem .1rem .32rem; background: rgba(74,163,255,.07); border: 1px solid var(--line); cursor: pointer; font-size: .68rem; letter-spacing: .04em; text-align: center; }
  .chip .n { display: block; font-size: .6rem; color: var(--muted); }
  .chip .dot { display: block; width: 9px; height: 9px; margin: 0 auto .2rem; border-radius: 50%; box-shadow: 0 0 6px currentColor; }
  .chip:hover:not(:disabled) { border-color: var(--line-hi); background: rgba(74,163,255,.16); }
  .chip.on { border-color: var(--cyan); background: rgba(107,230,255,.18); box-shadow: 0 0 10px var(--glow); }
  .chip:disabled { opacity: .32; cursor: default; }
  #elements .legend { margin-top: .45rem; font-size: .68rem; color: var(--muted); }

  #bar { bottom: 12px; left: 50%; transform: translateX(-50%); padding: .5rem .6rem; display: flex; gap: .9rem; align-items: center; flex-wrap: wrap; justify-content: center; }
  .group { display: flex; gap: 4px; align-items: center; }
  .group > span { font-size: .66rem; letter-spacing: .22em; color: var(--muted); margin-right: .25rem; text-transform: uppercase; }
  .btn { min-width: 38px; padding: .45rem .6rem; background: rgba(74,163,255,.08); border: 1px solid var(--line); cursor: pointer; font-size: .78rem; font-weight: 700; letter-spacing: .1em; }
  .btn:hover:not(:disabled) { border-color: var(--line-hi); }
  .btn.on { border-color: var(--cyan); background: rgba(107,230,255,.2); color: #fff; box-shadow: 0 0 10px var(--glow); }
  .btn:disabled { opacity: .3; cursor: default; }
  .btn:focus-visible, .chip:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

  .tag { position: fixed; z-index: 1; padding: .25rem .65rem; font-size: .74rem; font-weight: 800; letter-spacing: .2em; color: #fff; background: var(--panel); border: 1px solid var(--line-hi); transform: translate(-50%, 0); pointer-events: none; white-space: nowrap; }
  .tag small { font-weight: 500; letter-spacing: .08em; color: var(--muted); }
  #hint { position: fixed; z-index: 1; bottom: 76px; left: 50%; transform: translateX(-50%); font-size: .72rem; color: rgba(255,255,255,.85); text-shadow: 0 1px 3px rgba(0,0,0,.6); pointer-events: none; white-space: nowrap; }
  body.noui .win, body.noui #hint, body.noui .tag { display: none !important; }

  @media (max-width: 760px) {
    #info { max-width: none; right: 12px; padding: .5rem .8rem; }
    #elements { top: auto; bottom: 118px; left: 12px; right: 12px; width: auto; padding: .45rem; }
    #elements h2, #elements .legend { display: none; }
    #elements .grid { display: flex; overflow-x: auto; gap: 5px; scrollbar-width: none; }
    .chip { flex: 0 0 62px; }
    #bar { left: 12px; right: 12px; transform: none; gap: .45rem; padding: .45rem; }
    .group > span { display: none; }
    .btn { min-width: 0; padding: .45rem .5rem; font-size: .74rem; }
    #hint { display: none; }
  }
</style>
</head>
<body>
<div class="win" id="info">
  <h2>Dragon Gallery</h2>
  <div class="el" id="elName"></div>
  <div class="meta" id="elMeta"></div>
</div>

<div class="win" id="elements">
  <h2>Elements</h2>
  <div class="grid" id="elGrid"></div>
  <div class="legend">Greyed out: dragon not designed yet</div>
</div>

<div class="win" id="bar">
  <div class="group" id="stGroup"><span>Stage</span></div>
  <div class="group"><span>View</span>
    <button class="btn" id="homeBtn" title="Show the dragon resting in its habitat">Home</button>
    <button class="btn" id="spinBtn" title="Slowly turn the camera">Spin</button>
  </div>
</div>
<div id="hint">Drag to turn · scroll / pinch to zoom</div>

<script src="../vendor/three/three.min.js"></script>
<script src="../vendor/three/OrbitControls.js"></script>
<script>
  ['extras/math/SimplexNoise.js', 'extras/utils/BufferGeometryUtils.js', 'extras/geometries/RoundedBoxGeometry.js',
   'extras/environments/RoomEnvironment.js', 'extras/shaders/CopyShader.js', 'extras/shaders/LuminosityHighPassShader.js',
   'extras/shaders/SSAOShader.js', 'extras/shaders/GammaCorrectionShader.js', 'extras/shaders/FXAAShader.js',
   'extras/postprocessing/EffectComposer.js', 'extras/postprocessing/RenderPass.js', 'extras/postprocessing/ShaderPass.js',
   'extras/postprocessing/MaskPass.js', 'extras/postprocessing/UnrealBloomPass.js', 'extras/postprocessing/SSAOPass.js'
  ].forEach(function (f) { document.write('<script src="../vendor/three/' + f + '"><\/script>'); });
</script>
<script src="lib/kit3d.js"></script>
<script src="habitats/registry.js"></script>
<script src="dragons/registry.js"></script>
<script src="dragons/dragonkit.js"></script>
<script>
  // Every designed dragon file + every habitat file (for the Home view).
  var DRAGON_FILES = ['fire'];
  var HABITAT_FILES = ['fire', 'water', 'earth', 'forest', 'ice', 'electric', 'wind', 'metal', 'light', 'dark', 'poison', 'crystal', 'storm', 'spirit', 'time', 'cosmic'];
  DRAGON_FILES.forEach(function (id) { document.write('<script src="dragons/' + id + '.js"><\/script>'); });
  HABITAT_FILES.forEach(function (id) { document.write('<script src="habitats/' + id + '.js"><\/script>'); });
</script>
<script>
(function () {
'use strict';

/* ============================ Settings ============================ */
var PLOT = 3;                                                   // habitat plot size (Home view)
var FREE_DIR = new THREE.Vector3(1, 0.62, 1.15).normalize();   // camera start: front-right, a bit above
var ROW_DIR = new THREE.Vector3(1, 0, -1).normalize();         // side-by-side row runs left -> right on screen
var FACE = 0.12;                                               // three-quarter view: near wing open to the camera (a frontal view turns both wings edge-on)
var HOME_SCALE = 0.5;                                          // dragon size inside a habitat (same for every stage)

/* ============================ View state (mirrored in the URL) ============================ */
var q = new URLSearchParams(location.search);
var view = { el: q.get('el') || 'fire', st: q.get('st') || 'adult', home: q.get('home') === '1', spin: q.has('spin') };
if (q.get('ui') === '0') document.body.classList.add('noui');
if (!DRAGONS.has(view.el)) view.el = (HABITAT_ELEMENTS.filter(function (e) { return DRAGONS.has(e.id); })[0] || {}).id;

/* ============================ Scene ============================ */
var scene = new THREE.Scene();
scene.background = (function () {
  var c = document.createElement('canvas'); c.width = 4; c.height = 512;
  var x = c.getContext('2d'), g = x.createLinearGradient(0, 0, 0, 512);
  g.addColorStop(0, '#2a74c4'); g.addColorStop(0.5, '#7fc0ee'); g.addColorStop(1, '#e8f5ff');
  x.fillStyle = g; x.fillRect(0, 0, 4, 512); var t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t;
})();
var camera = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.1, 200);
var R3 = K3.createRenderer(scene, camera, { ao: true, aoRadius: 0.3, aoMax: 0.012, bloom: 0.25, bloomThreshold: 0.93, exposure: 0.85 });
document.body.prepend(R3.renderer.domElement);
var controls = new THREE.OrbitControls(camera, R3.renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.12; controls.maxPolarAngle = 1.45;
var LIGHTS = K3.lights(scene, 5);
function fitShadows(half) {
  var a = Math.max(3, half + 1.5), sun = LIGHTS.sun;
  sun.position.set(-a * 0.9, a * 1.8, a * 0.7);
  Object.assign(sun.shadow.camera, { left: -a, right: a, top: a, bottom: -a, near: 0.3, far: a * 6 });
  sun.shadow.camera.updateProjectionMatrix();
}

/* ============================ Shared ground ============================ */
var GROUND = {
  stone: K3.mat('stone', { repeat: 2, color: '#5d6878' }),
  dirt: K3.mat('dirt', { repeat: 2, color: '#b9a28a' }),
  turf: K3.mat('grass', { repeat: 1 })
};
// Round display pedestal with a glowing ring in the element colour.
function pedestal(radius, color) {
  var g = new THREE.Group();
  var base = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius * 1.06, 0.16, 48), GROUND.stone);
  base.position.y = -0.08; base.receiveShadow = base.castShadow = true; g.add(base);
  var ring = new THREE.Mesh(new THREE.TorusGeometry(radius * 0.98, 0.012, 6, 96), K3.mat('glow', { color: color, intensity: 1.8 }));
  ring.rotation.x = Math.PI / 2; ring.position.y = 0.004; g.add(ring);
  return g;
}
// Habitat plot for the Home view (same 3x3 plot as the Habitat Gallery).
function plot(footprint, seed) {
  var g = new THREE.Group();
  var soil = K3.roundedBox(PLOT, 0.55, PLOT, 0.06, GROUND.dirt); soil.position.y = -0.3; g.add(soil);
  var turf = K3.roundedBox(PLOT + 0.02, 0.08, PLOT + 0.02, 0.03, GROUND.turf); turf.position.y = -0.02; g.add(turf);
  g.add(K3.grass({ count: 5200, width: PLOT - 0.05, depth: PLOT - 0.05, height: 0.22, y: 0.02, seed: seed,
    area: function (px, pz) { return Math.hypot(px, pz) > footprint; } }));
  return g;
}

/* ============================ Stage (rebuilt on every view change) ============================ */
var stage = null, tags = [], baseAnims = K3.anims.length, fitInfo = { h: 1, w: 1 };

function disposeStage() {
  if (!stage) return;
  stage.traverse(function (o) {
    if (o.geometry) o.geometry.dispose();
    if (o.material && !Object.values(GROUND).includes(o.material)) [].concat(o.material).forEach(function (m) { m.dispose(); });
  });
  scene.remove(stage); stage = null;
  tags.forEach(function (t) { t.el.remove(); }); tags = [];
}

function stagesToShow(def) {
  var list = view.st === 'all' ? def.stages.slice() : [def.stages.indexOf(view.st) >= 0 ? view.st : def.stages[def.stages.length - 1]];
  if (view.home) list = list.filter(function (s) { return s !== 'egg'; });   // eggs live in the Hatchery, not in habitats
  return list;
}

function rebuild() {
  disposeStage();
  K3.anims.length = baseAnims;
  var def = DRAGONS.get(view.el), el = HABITAT_ELEMENTS.filter(function (e) { return e.id === view.el; })[0];
  if (!def) return;
  stage = new THREE.Group(); scene.add(stage);
  var ctx = { rng: function (s) { return K3.rng(s); }, anim: function (fn) { K3.anims.push(fn); } };
  var list = stagesToShow(def), n = list.length, hab = view.home ? HABITATS.get(view.el) : null;
  var spacing = hab ? 4.3 : (view.st === 'all' ? 2.7 : 0), maxH = 0.6;
  list.forEach(function (st, i) {
    var off = ROW_DIR.clone().multiplyScalar((i - (n - 1) / 2) * spacing), holder = new THREE.Group();
    holder.position.copy(off); stage.add(holder);
    var model = def.build(st, ctx), h = model.userData.height || 1;
    model.rotation.y = FACE;
    if (hab) {
      var lv = hab.levels, p = plot(hab.footprint, 50 + lv); holder.add(p);
      p.add(hab.build(lv, ctx));
      model.scale.setScalar(HOME_SCALE); model.position.set(hab.dragonSpot.x, hab.dragonSpot.y, hab.dragonSpot.z);
      holder.add(model); maxH = Math.max(maxH, 3.2);
    } else {
      holder.add(pedestal(st === 'adult' ? 1.15 : st === 'juvenile' ? 0.8 : 0.5, el ? el.color : '#6be6ff'));
      holder.add(model); maxH = Math.max(maxH, h);
    }
    var info = DRAGON_STAGES.filter(function (s) { return s.id === st; })[0];
    var tg = document.createElement('div'); tg.className = 'tag';
    tg.innerHTML = info.name.toUpperCase() + ' <small>· ' + info.when.split(' (')[0] + '</small>';
    document.body.appendChild(tg);
    tags.push({ el: tg, pos: off.clone().add(new THREE.Vector3(0, hab ? -0.6 : -0.25, hab ? PLOT / 2 : 0)) });
  });
  fitInfo = { h: maxH, w: (n - 1) * spacing + (hab ? PLOT * 1.5 : 2.6) };
  fitShadows(fitInfo.w / 2);
  fitCamera();
}

/* ============================ Camera ============================ */
function fitCamera() {
  var vf = THREE.MathUtils.degToRad(camera.fov), hf = 2 * Math.atan(Math.tan(vf / 2) * camera.aspect);
  var d = Math.max((fitInfo.h + 0.8) / (2 * Math.tan(vf / 2)), fitInfo.w / (2 * Math.tan(hf / 2))) * 1.2;
  var target = new THREE.Vector3(0, fitInfo.h * 0.42, 0);
  controls.target.copy(target);
  camera.position.copy(target).add(FREE_DIR.clone().multiplyScalar(d));
  controls.minDistance = d * 0.3; controls.maxDistance = d * 2.2;
  controls.autoRotate = view.spin; controls.autoRotateSpeed = 0.8;
  controls.update();
}
addEventListener('resize', fitCamera);

/* ============================ UI ============================ */
function syncUrl() {
  var p = new URLSearchParams(location.search);
  p.set('el', view.el); p.set('st', view.st);
  if (view.home) p.set('home', '1'); else p.delete('home');
  if (view.spin) p.set('spin', ''); else p.delete('spin');
  history.replaceState(null, '', '?' + p.toString().replace('spin=', 'spin'));
}
function buildElementGrid() {
  var grid = document.getElementById('elGrid');
  HABITAT_ELEMENTS.forEach(function (e, i) {
    var b = document.createElement('button');
    b.className = 'chip'; b.dataset.el = e.id; b.disabled = !DRAGONS.has(e.id);
    b.title = e.name + (b.disabled ? ' (not designed yet)' : '');
    b.innerHTML = '<span class="dot" style="background:' + e.color + ';color:' + e.color + '"></span>' + e.name + '<span class="n">#' + (i + 1) + '</span>';
    b.addEventListener('click', function () { view.el = e.id; refresh(); });
    grid.appendChild(b);
  });
}
function buildButtons() {
  var g = document.getElementById('stGroup');
  DRAGON_STAGES.forEach(function (s) { g.insertAdjacentHTML('beforeend', '<button class="btn" data-st="' + s.id + '">' + s.name + '</button>'); });
  g.insertAdjacentHTML('beforeend', '<button class="btn" data-st="all" title="Whole evolution chain side by side">All</button>');
  g.addEventListener('click', function (ev) { var b = ev.target.closest('[data-st]'); if (b && !b.disabled) { view.st = b.dataset.st; refresh(); } });
  document.getElementById('homeBtn').addEventListener('click', function () { view.home = !view.home; if (view.home && view.st === 'egg') view.st = 'adult'; refresh(); });
  document.getElementById('spinBtn').addEventListener('click', function () { view.spin = !view.spin; controls.autoRotate = view.spin; syncUrl(); updateUi(); });
}
function updateUi() {
  var def = DRAGONS.get(view.el), e = HABITAT_ELEMENTS.filter(function (x) { return x.id === view.el; })[0];
  if (!def || !e) return;
  var nm = document.getElementById('elName'); nm.textContent = e.name + ' Dragon'; nm.style.color = e.color;
  var st = DRAGON_STAGES.filter(function (s) { return s.id === view.st; })[0];
  document.getElementById('elMeta').innerHTML = st
    ? '<b>' + st.name + '</b> · ' + st.when + '<br>Skill slots: <b>' + st.slots + '</b>' + (view.home && st.id === 'egg' ? '<br>Eggs stay in the Hatchery' : '')
    : '<b>Evolution chain</b> · Egg → Hatchling (Lv 1) → Juvenile (Lv 10) → Adult (Lv 20)' + (view.home ? '<br>Home view: eggs stay in the Hatchery' : '');
  document.querySelectorAll('.chip').forEach(function (c) { c.classList.toggle('on', c.dataset.el === view.el); });
  document.querySelectorAll('[data-st]').forEach(function (b) {
    b.disabled = (b.dataset.st !== 'all' && def.stages.indexOf(b.dataset.st) < 0) || (view.home && b.dataset.st === 'egg');
    b.classList.toggle('on', b.dataset.st === view.st);
  });
  document.getElementById('homeBtn').classList.toggle('on', view.home);
  document.getElementById('homeBtn').disabled = !HABITATS.has(view.el);
  document.getElementById('spinBtn').classList.toggle('on', view.spin);
  document.title = 'Dragon Gallery · ' + e.name + ' · ' + (st ? st.name : 'evolution chain');
}
function refresh() { syncUrl(); updateUi(); rebuild(); }

buildElementGrid();
buildButtons();
refresh();

var clock = new THREE.Clock(), v = new THREE.Vector3();
(function loop() {
  var dt = Math.min(clock.getDelta(), 0.1), t = clock.elapsedTime;
  controls.update();
  K3.anims.forEach(function (fn) { fn(t, dt); });
  tags.forEach(function (tg) {
    v.copy(tg.pos).project(camera);
    tg.el.style.display = v.z > 1 ? 'none' : '';
    tg.el.style.left = ((v.x + 1) / 2 * innerWidth) + 'px'; tg.el.style.top = ((1 - v.y) / 2 * innerHeight) + 'px';
  });
  R3.render();
  requestAnimationFrame(loop);
})();
})();
</script>
</body>
</html>
